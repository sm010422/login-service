spring:
  application:
    name: login

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/login-service-db}
    username: ${SPRING_DATASOURCE_USERNAME:login-service}
    password: ${SPRING_DATASOURCE_PASSWORD:login-service-password}
    driver-class-name: org.postgresql.Driver

  output:
    ansi:
      enabled: ALWAYS

  security:
      oauth2:
        client:
          registration:
            google:
              client-id: ${GOOGLE_CLIENT_ID}
              client-secret: ${GOOGLE_CLIENT_SECRET}
              scope:
                - email
                - profile
            kakao:
              client-id: ${KAKAO_REST_API_KEY}
              client-secret: ${KAKAO_CLIENT_SECRET}
              redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
              authorization-grant-type: authorization_code
              client-authentication-method: client_secret_post
              client-name: Kakao
              scope:
                - account_email
                - profile_nickname
