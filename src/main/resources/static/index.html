<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소셜 로그인 테스트</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 450px; /* 토큰 가독성을 위해 너비를 조금 넓혔습니다 */
        }
        .login-container h2 { margin-bottom: 10px; color: #333; }
        .login-container p { color: #777; margin-bottom: 30px; font-size: 14px; }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            box-sizing: border-box;
            transition: opacity 0.2s;
            cursor: pointer;
            border: none;
        }
        .btn:hover { opacity: 0.8; }
        .btn-google { background-color: #ffffff; color: #333; border: 1px solid #ddd; }
        .btn-kakao { background-color: #FEE500; color: #000000; }
        .btn-naver { background-color: #03C75A; color: #ffffff; }
        .btn-logout { background-color: #ff4d4d; color: white; margin-top: 20px; }
        
        /* 토큰 표시 영역 스타일 개선 */
        .token-box {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            margin-bottom: 20px;
            max-height: 200px;
            overflow-y: auto;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
            color: #495057;
            white-space: pre-wrap;
        }
        .token-title {
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 5px;
            color: #212529;
            display: block;
        }

        #login-form { display: block; }
        #user-info { display: none; }
    </style>
</head>
<body>

<div class="login-container">
    <div id="login-form">
        <h2>환영합니다! 👋</h2>
        <p>소셜 계정으로 간편하게 로그인하세요.</p>
        <a href="/oauth2/authorization/google?prompt=select_account" class="btn btn-google">Google 로그인</a>

        <a href="/oauth2/authorization/kakao?prompt=login" class="btn btn-kakao">카카오 로그인</a>

        <a href="/oauth2/authorization/naver?auth_type=reprompt" class="btn btn-naver">네이버 로그인</a>
    </div>

    <div id="user-info">
        <h2>로그인 성공! 🎉</h2>
        <p>현재 저장된 인증 토큰 정보입니다.</p>
        
        <div class="token-box">
            <span class="token-title">[Access Token]</span>
            <div id="access-token-display">없음</div>
        </div>

        <button onclick="handleLogout()" class="btn btn-logout">로그아웃 (토큰 삭제)</button>
    </div>
</div>

<script>
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const tokenFromUrl = urlParams.get('accessToken');

        if (tokenFromUrl) {
            localStorage.setItem('accessToken', tokenFromUrl);
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        checkLoginStatus();
    };

    function checkLoginStatus() {
        const token = localStorage.getItem('accessToken');
        const loginForm = document.getElementById('login-form');
        const userInfo = document.getElementById('user-info');
        const accessTokenDisplay = document.getElementById('access-token-display');

        if (token) {
            loginForm.style.display = 'none';
            userInfo.style.display = 'block';
            // 토큰 전체를 크고 명확하게 표시
            accessTokenDisplay.innerText = token;
            console.log("현재 로그인 상태입니다.");
        } else {
            loginForm.style.display = 'block';
            userInfo.style.display = 'none';
            console.log("로그인이 필요합니다.");
        }
    }

    function handleLogout() {
        if (confirm("로그아웃 하시겠습니까? 저장된 모든 토큰이 삭제됩니다.")) {
            // Access Token 삭제
            localStorage.removeItem('accessToken');
            
            // 만약 refreshToken이 쿠키가 아닌 로컬스토리지에 저장된다면 아래 코드도 활성화
            // localStorage.removeItem('refreshToken');
            
            alert("로그아웃 되었습니다.");
            location.reload();
        }
    }
</script>

</body>
</html>
